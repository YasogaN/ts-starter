pre-commit:
  commands:
    biome:
      glob: '*.{ts,js,cjs,mjs,json,md,yml,yaml}'
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
